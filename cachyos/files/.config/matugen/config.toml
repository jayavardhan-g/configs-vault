# User matugen templates. DMS (DankMaterialShell) appends this file's templates section
# to its own generated config on every theme regeneration. Noctalia doesn't read it.
# Careful: DMS finds that section by plain text search, so the bracketed section name
# must appear exactly once in this file (as the real header below), never in a comment.

[config]

[templates]

# DMS has no built-in btop template; this reuses Noctalia's (same matugen syntax).
[templates.dmsbtop]
input_path = '~/.config/matugen/templates/btop.theme'
output_path = '~/.config/btop/themes/dank.theme'
