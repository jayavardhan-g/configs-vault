[global]
   workgroup = WORKGROUP
   server string = NAS
   security = user
   map to guest = never
   server min protocol = SMB2
   client min protocol = SMB2
   log file = /var/log/samba/log.%m
   max log size = 1000

[nas]
   path = /srv/nas
   valid users = <user>
   read only = no
   browsable = yes
   guest ok = no
