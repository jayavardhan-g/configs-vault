# vim-style keys

# seek
h seek -5
l seek 5
H seek -30
L seek 30
Ctrl+h seek -1 exact
Ctrl+l seek 1 exact

# volume
k add volume 5
j add volume -5

# playlist
g playlist-prev
G playlist-next

# frame step and speed
, frame-back-step
. frame-step
[ multiply speed 0.9
] multiply speed 1.1
{ multiply speed 0.5
} multiply speed 2.0
BS set speed 1.0

# percent seek
0 seek 0 absolute-percent
1 seek 10 absolute-percent
2 seek 20 absolute-percent
3 seek 30 absolute-percent
4 seek 40 absolute-percent
5 seek 50 absolute-percent
6 seek 60 absolute-percent
7 seek 70 absolute-percent
8 seek 80 absolute-percent
9 seek 90 absolute-percent

# misc
SPACE cycle pause
f cycle fullscreen
m cycle mute
q quit
Q quit-watch-later
: script-binding console/enable

# uosc menu on right click / Tab
MBTN_RIGHT script-binding uosc/menu
TAB script-binding uosc/menu
