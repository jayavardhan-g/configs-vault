# uosc replaces the stock on-screen controller
osc=no
osd-bar=no
border=no

# resume playback where you left off (quit with Q to save)
save-position-on-quit=yes
# stay open at end of file instead of closing
keep-open=yes
volume-max=150
vo=gpu-next
# Hybrid Intel+NVIDIA laptop: Hyprland composites on the Intel iGPU, so keep
# mpv's decode and render on Intel too. With the defaults (NVIDIA Vulkan +
# nvdec) every frame crossed GPUs, and playback froze then jumped ahead,
# especially on the NVIDIA-wired HDMI screen.
vulkan-device='Intel(R) UHD Graphics (CML GT2)'
hwdec=vaapi

# screenshots go next to satty's
screenshot-directory=~/Pictures
screenshot-template=mpv-%F-%P
