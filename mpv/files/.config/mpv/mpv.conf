# uosc replaces the stock on-screen controller
osc=no
osd-bar=no
border=no

# resume playback where you left off (quit with Q to save)
save-position-on-quit=yes
# stay open at end of file instead of closing
keep-open=yes
volume-max=150
vo=gpu-next
hwdec=auto-safe

# screenshots go next to satty's
screenshot-directory=~/Pictures
screenshot-template=mpv-%F-%P
