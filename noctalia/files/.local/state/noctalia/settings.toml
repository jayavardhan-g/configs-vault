config_version = 14

[accessibility]
ui_scale = 1.0000000074505806

[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 0.89999997988343239
    center = [ "clock", "bar", "todo" ]
    end = [
        "workspaces",
        "media",
        "spacer_1",
        "tray",
        "notifications",
        "bluetooth",
        "network",
        "volume",
        "battery",
        "session"
    ]
    layer = "overlay"
    reserve_space = false
    shadow = false
    smart_auto_hide = true
    start = [ "group:g1", "active_window" ]

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
magnification_scale = 1.2000000029802322

[hot_corners.bottom_left]
action = "window_switcher"

[idle]
behavior_order = [ "lock", "screen-off" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 300.0

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 959.999755859375
    cy = 715.99981689453125
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 800.00018310546875
    cy = 672.49957275390625
    output = "eDP-1"
    placement_height = 900.0
    placement_width = 1600.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugin_settings."nightwatch75/todo"]
sound_on_complete = true

[plugins]
enabled = [ "nightwatch75/todo", "noctalia/timer" ]

[shell]
popup_shadows = false
settings_show_advanced = false

    [shell.animation]
    enabled = false

    [shell.panel]
    shadow = false

[theme]
builtin = "Ayu"
community_palette = "Catppuccin Mocha Blue"
mode = "dark"
shell_mode = "dark"
wallpaper_scheme = "m3-fruit-salad"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "gtk3", "gtk4", "kcolorscheme", "kitty", "qt" ]

[wallpaper]
directory = "/home/<user>/Downloads/wallpapers"
fill_mode = "stretch"
transition = [ "stripes" ]

    [wallpaper.automation]
    enabled = true

    [wallpaper.default]
    path = "/home/<user>/Downloads/wallpapers/miles-morales-spiderman-suit-big-logo-vibrant-city-desktop-wallpaper.jpg"

    [wallpaper.last]
    path = "/home/<user>/Downloads/wallpapers/miles-morales-spiderman-suit-big-logo-vibrant-city-desktop-wallpaper.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/<user>/Downloads/wallpapers/miles-morales-spiderman-suit-big-logo-vibrant-city-desktop-wallpaper.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/<user>/Downloads/wallpapers/miles-morales-spiderman-suit-big-logo-vibrant-city-desktop-wallpaper.jpg"

[widget.bar]
enabled = false
type = "noctalia/timer:bar"

[widget.bar_2]
type = "noctalia/timer:bar"

[widget.clock]
format = "{:%H:%M %A %d/%m/%y}"

[widget.launcher]
enabled = false

[widget.media]
album_art_only = true

[widget.network]
show_label = false

[widget.sysmon_2]
enabled = false

[widget.temp]
enabled = false

[widget.todo]
type = "nightwatch75/todo:todo"

[widget.todo_2]
type = "nightwatch75/todo:todo"